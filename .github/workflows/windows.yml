name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: E2E в Electron (Windows)
        run: npm run e2e
      - name: Портативная сборка
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Sketch-Timer-win32-x64
          path: release/*.zip
          retention-days: 3
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          name: Sketch Timer ${{ github.ref_name }}
